name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flowith ${{ github.ref_name }}'
          releaseBody: 'Flowith - 多AI智能体协作平台'
          releaseDraft: false
          prerelease: false
          args: '--target ${{ matrix.target }}'

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android

      - name: Update Capacitor plugins
        run: npx cap update android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK for release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Flowith_${VERSION}_android.apk"
          ls -lh "Flowith_${VERSION}_android.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Flowith_*_android.apk"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-updater:
    needs: [build, build-android]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish updater JSON
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > latest.json << EOF
          {
            "version": "$TAG",
            "notes": "Flowith $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_x64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_x64-setup.nsis.zip"
              },
              "android": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${VERSION}_android.apk"
              }
            }
          }
          EOF

      - name: Update download page fallback version
        run: |
          TAG="${{ github.ref_name }}"
          sed -i "s|const FALLBACK_VERSION = 'v[0-9.]*';|const FALLBACK_VERSION = '${TAG}';|g" docs/download/index.html
          sed -i "s|id=\"hero-version\">v[0-9.]*<|id=\"hero-version\">${TAG}<|g" docs/download/index.html

      - name: Commit download page update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update download page fallback version to ${{ github.ref_name }}"
          file_pattern: 'docs/download/index.html'
