name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flowith ${{ github.ref_name }}'
          releaseBody: 'Flowith - 多AI智能体协作平台'
          releaseDraft: false
          prerelease: false
          args: '--target ${{ matrix.target }}'

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish updater JSON
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > latest.json << EOF
          {
            "version": "$TAG",
            "notes": "Flowith $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_x64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/Flowith_${TAG}_x64-setup.nsis.zip"
              }
            }
          }
          EOF
          echo "Updater JSON:"
          cat latest.json

      - name: Update download page fallback version
        run: |
          TAG="${{ github.ref_name }}"
          # Update FALLBACK_VERSION in the download page JS
          sed -i "s|const FALLBACK_VERSION = 'v[0-9.]*';|const FALLBACK_VERSION = '${TAG}';|g" docs/download/index.html
          # Update static fallback download links (data-pattern cards have dynamic JS, but hero badge and CTA have static fallback)
          sed -i "s|id=\"hero-version\">v[0-9.]*<|id=\"hero-version\">${TAG}<|g" docs/download/index.html
          echo "Updated download page fallback to ${TAG}"

      - name: Commit download page update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update download page fallback version to ${{ github.ref_name }}"
          file_pattern: 'docs/download/index.html'
